- name: Install useful tools for data processing etc.
  hosts: all
  vars:
    home_dir: "/home/fast-bench"
  tasks:
    - name: Clone Set preprocessing
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/set-preprocessing"
        repo: "git@frosch.cosy.sbg.ac.at:datasets/sets/tools.git"
        version: master
      notify: compile_setpreprocessing

  handlers:
    - name: Compile Set Preprocessing
      listen: compile_setpreprocessing
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/set-preprocessing/preprocessing"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_BUILD_TYPE=release .. && make -j 4"
        - "cp build/preprocess {{ home_dir }}/experiments/set-preprocess"
