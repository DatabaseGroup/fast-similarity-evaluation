- name: Install FAST
  hosts: all

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        state: present
        update_cache: true
        pkg:
          - "build-essential"
          - "cmake"
          - "curl"
          - "git"
          - "lsb-release"
          - "parallel"
          - "python3"
          - "python3-setuptools"
          - "python3-venv"
          - "tar"
          - "tmux"
          - "unzip"
          - "parallel"
          - "pkg-config"
          - "zip"

    - name: Create home directory
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item }}"
        mode: "0755"
        state: directory
      loop:
        - "bin"
        - "datasets"
        - "download"
        - "experiments"
        - "fast"
        - ".vcpkg"

    - name: Clone VCPKG
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/.vcpkg"
        repo: "https://github.com/microsoft/vcpkg.git"
        version: master
      notify: bootstrap_vcpkg

    - name: Clone FAST
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/fast"
        repo: "git@frosch.cosy.sbg.ac.at:dschmitt/fast.git"
        version: master
      notify: compile_fast

    - name: Copy datasets
      ansible.builtin.copy:
        remote_src: true
        src: "/mnt/dbgroup-share/dschmitt/datasets/"
        dest: "{{ home_dir }}/datasets/"


  handlers:
    - name: Bootstrap VCPKG
      listen: bootstrap_vcpkg
      ansible.builtin.command:
        chdir: "{{ home_dir }}/.vcpkg"
        cmd: "./bootstrap-vcpkg.sh -disableMetrics"

    - name: Add kappa host key
      listen: compile_fast
      ansible.builtin.known_hosts:
        name: "[kappa.gsk.moe]:4950"
        key: "[kappa.gsk.moe]:4950 ssh-rsa "

    - name: Compile FAST
      listen: compile_fast
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/fast/src"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_TOOLCHAIN_FILE={{ home_dir }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=release .. && make -j"
        - "cp -rf build/bin/* {{ home_dir }}/experiments"

    - name: Setup venv
      listen: compile_fast
      ansible.builtin.pip:
        name: pymongo
        virtualenv: "{{ home_dir }}/experiments/wrapper/venv"
        virtualenv_command: "python3 -m venv"
