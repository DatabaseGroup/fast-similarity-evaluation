- name: Install FAST
  hosts: all

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        state: present
        update_cache: true
        pkg:
          - "build-essential"
          - "cmake"
          - "curl"
          - "git"
          - "kitty-terminfo"
          - "lsb-release"
          - "parallel"
          - "python3"
          - "python3-setuptools"
          - "python3-venv"
          - "tar"
          - "tmux"
          - "unzip"
          - "parallel"
          - "pkg-config"
          - "zip"

    - name: Create home directory
      ansible.builtin.file:
        path: "{{ home_dir }}/{{ item }}"
        mode: "0755"
        state: directory
      loop:
        - "bin"
        - "datasets"
        - "download"
        - "experiments"
        - "fast"
        - ".vcpkg"

    - name: Copy datasets
      ansible.builtin.copy:
        remote_src: true
        src: "/mnt/dbgroup-share/dschmitt/datasets/"
        dest: "{{ home_dir }}/datasets/"

    - name: Clone VCPKG
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/.vcpkg"
        repo: "https://github.com/microsoft/vcpkg.git"
        version: master
      notify: bootstrap_vcpkg

    - name: Clone FAST
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/fast"
        repo: "git@frosch.cosy.sbg.ac.at:dschmitt/fast.git"
        version: master
      notify: compile_fast

    - name: Clone SyncSignatures
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/syncsignature"
        repo: "git@frosch.cosy.sbg.ac.at:dschmitt/syncsignature.git"
        version: main
      notify: compile_syncsignature

    - name: Clone LimesLight
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/limes-light"
        repo: "git@frosch.cosy.sbg.ac.at:dschmitt/limes-light.git"
        version: master
      notify: compile_limeslight

    - name: Clone Minjoin
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/minjoin"
        repo: "git@frosch.cosy.sbg.ac.at:dschmitt/minsimjoin.git"
        version: master
      notify: compile_minjoin

    - name: Clone TwoL
      ansible.builtin.git:
        accept_newhostkey: true
        dest: "{{ home_dir }}/twol"
        repo: "git@frosch.cosy.sbg.ac.at:dkocher/variant-clustering-code.git"
        version: ds/alllsh-jaccard
      notify: compile_twol

  handlers:
    - name: Bootstrap VCPKG
      listen: bootstrap_vcpkg
      ansible.builtin.command:
        chdir: "{{ home_dir }}/.vcpkg"
        cmd: "./bootstrap-vcpkg.sh -disableMetrics"

    - name: Add kappa host key
      listen: compile_fast
      ansible.builtin.known_hosts:
        name: "[kappa.gsk.moe]:4950"
        key: "[kappa.gsk.moe]:4950 ssh-rsa "

    - name: Compile FAST
      listen: compile_fast
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/fast/src"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_TOOLCHAIN_FILE={{ home_dir }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=release .. && make -j"
        - "cp -rf build/bin/* {{ home_dir }}/experiments"

    - name: Setup venv
      listen: compile_fast
      ansible.builtin.pip:
        name: pymongo
        virtualenv: "{{ home_dir }}/experiments/wrapper/venv"
        virtualenv_command: "python3 -m venv"

    - name: Compile SyncSignature
      listen: compile_syncsignature
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/syncsignature"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_TOOLCHAIN_FILE={{ home_dir }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=release .. && make -j ted"
        - "cp build/ted {{ home_dir }}/experiments/syncsignature"

    - name: Compile Limes-Light
      listen: compile_limeslight
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/limes-light/cpp"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_TOOLCHAIN_FILE={{ home_dir }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=release .. && make -j limes-light"
        - "cp build/limes-light {{ home_dir }}/experiments/limes-light"

    - name: Compile MinJoin
      listen: compile_minjoin
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/minjoin/minjoinpp"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_TOOLCHAIN_FILE={{ home_dir }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=release .. && make -j minsimjoin"
        - "cp build/minsimjoin {{ home_dir }}/experiments/minjoin"

    - name: Compile TwoL
      listen: compile_twol
      ansible.builtin.shell:
        chdir: "{{ home_dir }}/twol"
        cmd: "{{ item }}"
      loop:
        - "mkdir -p build"
        - "cd build && cmake -DCMAKE_TOOLCHAIN_FILE={{ home_dir }}/.vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=release .. && make -j cluster"
        - "cp build/cluster {{ home_dir }}/experiments/twol"