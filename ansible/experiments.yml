- name: Install and compile FAST
  hosts: all
  vars:
    home_dir: "/home/fast-bench"
  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        state: present
        update_cache: true
        pkg:
          - "kitty-terminfo"
          - "man-db"
          - "parallel"
          - "python3"
          - "python3-setuptools"
          - "python3-venv"
          - "tmux"

    - name: Copy datasets
      ansible.builtin.copy:
        remote_src: true
        src: "/mnt/dbgroup-share/dschmitt/datasets/"
        dest: "{{ home_dir }}/datasets/"

    - name: Setup virtualenv for FAST wrapper
      listen: compile_fast
      ansible.builtin.pip:
        name: pymongo
        virtualenv: "{{ home_dir }}/experiments/wrapper/venv"
        virtualenv_command: "python3 -m venv"